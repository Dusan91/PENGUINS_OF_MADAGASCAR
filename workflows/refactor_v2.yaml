name: Refactor → Code (Parallel v2)

scratchpad_dir: /tmp/penguins

description: |
  Dependency-ordered workflow for refactor/improvement tasks.
  Rico discovers → Kowalski plans → Skipper approves → Private implements → Melman validates.
  Note: No Figma involvement in refactor workflow.

execution_contract: |
  Skipper allocates a unique current run directory under scratchpad_dir; all
  /tmp/penguins report paths below are examples rebound to that run. Accept complete
  current inline reports or persisted reports with verified run/scope/provenance/content.
  Return structured status/run_id/role/scope/summary/issues/evidence/next/artifact_written/intended_path.
  Produce reports inline when writing is denied/unavailable; never retry denied
  writes or bypass restrictions through shell/delegation. Persist only if authorized
  and read back before claiming artifact_written: true. Skipper may assign an
  authorized exact-content writer, who cannot invent decisions or verdicts.
  Reject stale/path-only reports. Use only exposed tools/skills/roles; missing
  mandatory capabilities block. No permission/model/depth/integration expansion.
  Skipper may directly dispatch needed discovery specialists with bounded scopes;
  only independent supplied-input work may run in parallel. No required Rico nesting.
  A when condition is resolved explicitly by Skipper before dispatch; false steps
  are recorded not_applicable, not completed. Dependencies wait for all applicable
  steps; missing roles never make a true condition false. high_risk requires the
  risk/review/TS gates below; Private-2 requires approved independent work and exact
  disjoint file ownership. Overlap or missing ownership blocks parallel execution.
  Resolve high_risk from task/discovery (protected-area, security, API-contract or
  critical business-logic risk); unclear applicability blocks rather than defaults false.
  Stop on FAIL/REJECTED/BLOCK. Preserve audit and notification policy.
  This workflow owns mort/nana/julien exactly once whether direct or delegated
  from tiered MEDIUM. Preflight the actual exposed triad and every mandatory route
  role; missing roles block without substitution or permission/model/depth expansion.
  Before every specialist handoff require Mort's ready current-run packet matching
  target/task/source/constraints. Reuse only while current and applicable; refresh
  on material changes. Missing/clarification/blocked packets stop dependent work.
  Nana preapproval audits current plan/scope/security before Skipper approval;
  Nana postdiff audits actual introduced diffs before delivery. BLOCK, missing
  required evidence or unavailable role stops; CAUTION needs explicit Skipper disposition.
  Julien's current report is mandatory before finalization. insufficient_data is
  nonblocking ONLY for performance: state unmeasured, no performance/speedup claims.
  Missing role/report blocks. All existing discovery/risk/review/TS/QA gates remain.

steps:
  - id: skipper_preflight
    agent: skipper
    task: Verify exposed triad and all mandatory route roles, including applicable conditional roles; missing or unclear applicability blocks.
  - id: mort_context
    agent: mort
    depends_on: [skipper_preflight]
    task: Supply ready current target/task/source/constraints packets under execution_contract; refresh before dependent handoffs when necessary.
  # ═══════════════════════════════════════════════════
  # Discovery precedes analysis
  # ═══════════════════════════════════════════════════
  - id: rico_discovery
    agent: rico
    depends_on: [mort_context]
    isolated: true
    input:
      user_command: inputs/user-command.md
      repository_path: ~/Desktop/Hermes/whitelabel
    task: |
      You are Rico. Your ONLY job is discovery — no opinions, no plans.

      Read the user command from inputs/user-command.md.
      Explore the repository and produce a structured findings report:

        1. Files relevant to the task (paths + why)
        2. Current implementation of affected code (paste key snippets)
        3. Patterns used in the codebase (state management, data fetching, component structure)
        4. Any constraints or gotchas you found

      Return the complete report under execution_contract.
    output: /tmp/penguins/rico_findings.md

  - id: kowalski_analysis
    agent: kowalski
    isolated: true
    depends_on: [rico_discovery]
    input:
      user_command: inputs/user-command.md
    task: |
      You are Kowalski. Your ONLY job is analysis and planning — no implementation.

      Read:
        - User command: inputs/user-command.md
        - Rico's findings: /tmp/penguins/rico_findings.md

      Produce a concise implementation plan to /tmp/penguins/kowalski_plan.md:
        1. Exact files to change (path + what changes)
        2. Exact files NOT to touch and why
        3. Step-by-step implementation order with rationale
        4. Risk assessment (what could break)
        5. Compliance check against guardrails

      Return the complete report under execution_contract.
    output: /tmp/penguins/kowalski_plan.md

  - id: kowalski_risk
    agent: kowalski-risk
    when: high_risk
    depends_on: [kowalski_analysis]
    task: |
      Evaluate the current plan and discovery against guardrails. Return the full
      risk report under execution_contract; BLOCK stops approval. Missing role blocks.
    output: /tmp/penguins/kowalski_risk.md

  # ═══════════════════════════════════════════════════
  # STEP 3: Nana audits before Skipper approves
  # ═══════════════════════════════════════════════════
  - id: nana_preapproval
    agent: nana
    depends_on: [kowalski_analysis, kowalski_risk]
    input:
      kowalski_plan: Complete current kowalski_analysis plan
      proposed_scope: Exact proposed file allowlist and risks from that same plan
      risk_report: Current kowalski_risk report when high_risk; otherwise explicit not_applicable reason
      rules: [rules/coding-standards.md, rules/guardrails.md, rules/protected-areas.md]
    task: |
      Receive the current plan, exact proposed scope, applicable risk report and
      security rules in input. Accept complete inline evidence or authorized artifacts
      verified for current run/scope/provenance/content; paths alone are not evidence.
      Missing, stale, mismatched or unavailable required evidence blocks; preserve
      explicit conditional not_applicable reasons, never invent risk evidence.
      Audit before approval and report exact inspected plan/scope/risk/rules identities.
      BLOCK stops; CAUTION requires explicit Skipper disposition before approval.
    output: /tmp/penguins/nana_preapproval.md

  - id: skipper_approval
    agent: skipper
    isolated: true
    depends_on: [kowalski_analysis, kowalski_risk, nana_preapproval]
    parallel_group: null
    input:
      user_command: inputs/user-command.md
      kowalski_plan: /tmp/penguins/kowalski_plan.md
    task: |
      You are Skipper. Your ONLY job is to APPROVE or REJECT Kowalski's plan.
      Require current Nana preapproval; explicitly dispose of any CAUTION.

      Read:
        - User command: inputs/user-command.md
        - Kowalski's plan: /tmp/penguins/kowalski_plan.md
        - Guardrails: rules/guardrails.md

      Produce a decision under execution_contract for /tmp/penguins/skipper_decision.md:
        - APPROVED or REJECTED in the report payload
        - If REJECTED: exact reason + what Kowalski must fix
        - If APPROVED: confirm scope, confirm no guardrail violations
        - Exact file ownership for each implementer; Private-2 only for independent disjoint work

      Before stopping for user input, approval, rejection, or a blocker, notify with the matching event:
        node tools/notify.mjs --event approval_required --title "Penguins approval needed" --message "Skipper needs approval or scope clarification" --priority high

      If a blocker is detected, notify with the blocked event and include a blocker id plus optional follow-up message:
        node tools/notify.mjs --event blocked --title "Penguins blocked" --message "<blocker reason>" --blocker-id "<unique-id>" --followup-message "<resolution hint>" --priority high

      Return the complete report under execution_contract.
    output: /tmp/penguins/skipper_decision.md

  # ═══════════════════════════════════════════════════
  # STEP 4: Private implements
  # ═══════════════════════════════════════════════════
  - id: private_implementation
    agent: private
    isolated: true
    depends_on: [skipper_approval]
    input:
      rico_findings: /tmp/penguins/rico_findings.md
      kowalski_plan: /tmp/penguins/kowalski_plan.md
      skipper_decision: /tmp/penguins/skipper_decision.md
    task: |
      You are Private. Your ONLY job is implementation — no decisions, no planning.

      Read:
        - Rico's findings: /tmp/penguins/rico_findings.md
        - Kowalski's plan: /tmp/penguins/kowalski_plan.md
        - Skipper's approved file list: /tmp/penguins/skipper_decision.md

      RULES:
        - Only modify files explicitly assigned to Private in skipper_decision.md
        - Follow the plan exactly — do not improvise
        - If you encounter something unexpected, STOP and return a blocker
          under execution_contract instead of guessing

      After implementation produce a diff summary under execution_contract:
        - Each file changed: what was changed and why
        - Any blockers encountered

      Return the complete report under execution_contract.
    output: /tmp/penguins/private_diff.md

  - id: private_2_implementation
    agent: private-2
    when: private_2_approved
    depends_on: [skipper_approval]
    task: |
      Implement only the approved independent exact disjoint Private-2 file list.
      Read the current plan/approval. Return a diff under execution_contract.
    output: /tmp/penguins/private_2_diff.md

  - id: maurice_review
    agent: maurice
    when: high_risk
    depends_on: [private_implementation, private_2_implementation]
    task: |
      Review all applicable introduced diffs against the current approval.
      Return the full review under execution_contract; missing role or failed review blocks.
    output: /tmp/penguins/maurice_review.md

  - id: melman_ts
    agent: melman-ts
    when: high_risk
    depends_on: [private_implementation, private_2_implementation]
    task: |
      Validate all applicable introduced changes for types/lint and boundaries.
      Return evidence and limitations under execution_contract; missing role blocks.
    output: /tmp/penguins/melman_ts.md

  # ═══════════════════════════════════════════════════
  # STEP 5: Melman validates
  # ═══════════════════════════════════════════════════
  - id: melman_validation
    agent: melman
    isolated: true
    depends_on: [private_implementation, private_2_implementation, maurice_review, melman_ts]
    input:
      private_diff: /tmp/penguins/private_diff.md
      kowalski_plan: /tmp/penguins/kowalski_plan.md
      skipper_decision: /tmp/penguins/skipper_decision.md
    task: |
      You are Melman. Your ONLY job is validation — you are paranoid by nature.

      Read:
        - What Private implemented: /tmp/penguins/private_diff.md
        - What Kowalski planned: /tmp/penguins/kowalski_plan.md
        - What Skipper approved: /tmp/penguins/skipper_decision.md
        - rules/coding-standards.md, rules/guardrails.md, rules/react-next-rules.md, rules/protected-areas.md

      Check:
        1. Does the implementation match the plan?
        2. Are there any guardrail violations?
        3. Are there any new TypeScript/lint errors introduced?
        4. Are there any files changed that were NOT in Skipper's approved list?
        5. Any edge cases missed?

      Include every applicable implementation and review report; reject missing evidence.
      Produce validation under execution_contract:
        - PASS or FAIL in the report payload
        - List of issues found (if any)
        - List of checks that passed

      Return the complete report under execution_contract.
    output: /tmp/penguins/melman_report.md

  # ═══════════════════════════════════════════════════
  # STEP 6: Postdiff security and performance gates precede finalization
  # ═══════════════════════════════════════════════════
  - id: nana_postdiff
    agent: nana
    depends_on: [private_implementation, private_2_implementation]
    input:
      actual_diff: Complete actual introduced diff from private_implementation, not its summary
      private_2_diff: Complete actual introduced diff from private_2_implementation only when private_2_approved; otherwise explicit not_applicable reason
      approved_plan: Complete current Kowalski plan identified by skipper_approval
      approval_scope: Current skipper_approval decision and exact approved file ownership/allowlist
      rules: [rules/coding-standards.md, rules/guardrails.md, rules/protected-areas.md]
    task: |
      Receive every applicable actual introduced diff, approved plan, current Skipper
      approval/exact scope and rules in input. Accept complete inline evidence or
      authorized artifacts verified for current run/scope/provenance/content; a summary
      or path alone is not the actual diff. Missing, stale, mismatched or unavailable
      required evidence blocks. Preserve Private-2 not_applicable when not approved;
      otherwise its actual diff is required. Audit against the approved plan/scope and
      report exact inspected diff/plan/approval/scope/rules identities for each implementer.
      BLOCK stops delivery; CAUTION requires explicit Skipper disposition.
    output: /tmp/penguins/nana_postdiff.md

  - id: julien_performance
    agent: julien
    depends_on: [melman_validation, nana_postdiff]
    task: Report current-run verified workflow performance under execution_contract; insufficient_data is performance-only nonblocking with unmeasured/no speedup claims, never a missing report waiver.
    output: /tmp/penguins/julien_performance.md

  - id: skipper_finalization
    agent: skipper
    isolated: true
    depends_on: [melman_validation, nana_postdiff, julien_performance]
    input:
      rico_findings: /tmp/penguins/rico_findings.md
      kowalski_plan: /tmp/penguins/kowalski_plan.md
      private_diff: /tmp/penguins/private_diff.md
      melman_report: /tmp/penguins/melman_report.md
      audit_dir: audit/
      finalization_rules: rules/finalization.md
    task: |
      You are Skipper. Final review and audit log.
      Require all current triad reports; explicitly dispose of Nana postdiff CAUTION.
      Read all inputs. Then:

        1. Supply an audit entry for authorized exact-content persistence to audit/<today_date>.json and verify it
        2. Provide a concise summary of what was done
        3. Confirm whether all rules and standards were followed
        4. If Melman reported FAIL — describe what still needs fixing

      Notify before the final response:
        - Only if Melman reported PASS and delivery is approved: node tools/notify.mjs --event workflow_complete --title "Penguins workflow complete" --message "<Task text, or Task completed successfully if empty>" --priority default
        - If Melman reported FAIL: node tools/notify.mjs --event validation_failed --title "Penguins validation failed" --message "Melman reported validation issues" --priority high
        - If finalization fails for another reason: node tools/notify.mjs --event workflow_failed --title "Penguins workflow failed" --message "Workflow finalization failed" --priority high
        - If a blocker stops finalization: node tools/notify.mjs --event blocked --title "Penguins blocked" --message "<blocker reason>" --blocker-id "<unique-id>" --followup-message "<resolution hint>" --priority high

      Under rules/notification-network-exception.md, real workflow notifications use tools/notify.mjs without --dry-run for the allowed events above. Do not make direct ad-hoc network calls.

      Read /tmp/penguins/notifications.jsonl after notifying. Include the current attempt's status before the final phrase:
      Notification: sent|skipped|failed

      If sending is unavailable or forbidden, report not_attempted and its reason; never reuse historical delivery evidence. Preserve runtime/session restrictions and the existing notification policy.

      Follow rules/finalization.md. Select the final line by the actual event:
        - `workflow_complete`: `Smile and wave boys, smile and wave 🐧🐧🐧🐧🦒🐒`
        - `workflow_failed`: `Boys we have a problem!`
        - `validation_failed`: `Boys we have a problem!`
        - `blocked`: `Boys we have a problem!`
        - `blocker_resolved`: `Blocker je razrešen.`
        - `decision_required`: `Kowalski! Options!`
        - `approval_required`: `Kowalski! Options!`
        - `workflow_started`: `🐧 Penguins workflow started!`
      Only successfully validated workflow_complete may use the success phrase; every other status must never append it. Nothing follows the selected final line. Notification delivery does not establish workflow success.

parallel_execution:
  enabled: true
  groups: {}
  sequential_after:
    - skipper_preflight
    - mort_context
    - rico_discovery
    - kowalski_analysis
    - kowalski_risk
    - nana_preapproval
    - skipper_approval
    - private_implementation
    - private_2_implementation
    - maurice_review
    - melman_ts
    - melman_validation
    - nana_postdiff
    - julien_performance
    - skipper_finalization
