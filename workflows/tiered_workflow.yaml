name: Tiered Workflow (Smart Routing)
task_classifier:
  rules:
    - if: "figma-notes.md exists AND files > 5"
      tier: large  # Full workflow
    - if: "files > 2"
      tier: medium  # Rico + Private + Melman
    - else
      tier: small   # Private only
tiers:
  small:
    steps: [private_implementation]
  medium:
    steps: [rico_discovery, private_implementation, melman_validation]
  large:
    steps: [full_parallel_workflow]